name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:ext
      # Attach the one-click installer to the GitHub Release (what students download).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/reichman-courses.mcpb
          generate_release_notes: true
      # Also publish the npm package (for Codex / Claude Code via npx) when NPM_TOKEN is set.
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public || echo "npm publish skipped/failed (non-fatal)"
